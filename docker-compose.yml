version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: lifeos_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lifeos_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/lifeos
      - JWT_SECRET=${JWT_SECRET:-supersecret_default_key}
      # Add other SMTP or backend env vars here if needed
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # We set VITE_API_URL to /api because Nginx will internally proxy /api traffic to the backend container
        - VITE_API_URL=/api
    container_name: lifeos_frontend
    restart: unless-stopped
    ports:
      # Changed from host port 80 to 8080 to fix "address already in use" error
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
