version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: lifeos_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lifeos_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/lifeos
      - JWT_SECRET=${JWT_SECRET:-supersecret_default_key}
    depends_on:
      - mongodb
    networks:
      - internal

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: lifeos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      # REPLACE lifeos.yourdomain.com with your actual domain
      - "traefik.http.routers.lifeos.rule=Host(`lifeos.yourdomain.com`)"
      - "traefik.http.routers.lifeos.entrypoints=websecure"
      - "traefik.http.routers.lifeos.tls.certresolver=myresolver"
      - "traefik.http.services.lifeos.loadbalancer.server.port=80"

networks:
  internal:
  proxy:
    external: true

volumes:
  mongodb_data:
